name: Domenia v2 — recette des binaires publiés

# Disposable hosted runner only: downloads the exact published release ZIPs, checks their SHA-256 and drives the
# product's own commands (startup admission, real update 2.1.5 -> 2.1.6, restoration). It never publishes anything and
# never changes WinRM, the firewall, policies, services or accounts.
on:
  push:
    branches: ['claude/recette-binaires-216']
    paths:
      - '.github/workflows/domenia-v2-recette-binaires.yml'
      - 'v2/tools/recette-binaires-publies.ps1'
  workflow_dispatch:
    inputs:
      candidate_run:
        description: 'Run de la CI de livraison qui a produit le ZIP candidat (vide : binaires publiés seuls)'
        required: false
        default: ''
      candidate_version:
        description: 'Version du candidat, par exemple 2.1.7'
        required: false
        default: ''
      candidate_sha256:
        description: 'SHA-256 attendu du ZIP candidat'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: domenia-v2-recette-binaires-${{ github.ref }}
  cancel-in-progress: false

jobs:
  published:
    name: Windows x64 · binaires publiés 2.1.5 et 2.1.6
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: powershell
    steps:
      - name: Récupérer le commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Récupérer le ZIP candidat de la CI de livraison
        if: ${{ inputs.candidate_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: |
          if ($env:CANDIDATE_RUN -notmatch '^[0-9]{6,20}$' -or $env:CANDIDATE_VERSION -notmatch '^2\.[0-9]+\.[0-9]+$') { throw 'Entrees du candidat invalides.' }
          $dir = Join-Path $env:RUNNER_TEMP 'candidat'
          gh run download $env:CANDIDATE_RUN -R $env:GITHUB_REPOSITORY -D $dir -p 'domenia-v2-delivery-[0-9a-f]*'
          if ($LASTEXITCODE) { throw 'Telechargement du candidat impossible.' }
          $zip = @(Get-ChildItem -LiteralPath $dir -Recurse -File -Filter ('Domenia_' + $env:CANDIDATE_VERSION + '_PROD-LIGHT_Windows-x64.zip'))
          if ($zip.Count -ne 1) { throw 'ZIP candidat absent ou ambigu.' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ('CANDIDATE_ZIP=' + $zip[0].FullName)

      - name: Admission au démarrage, mise à jour et restauration avec les ZIP publiés
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
        run: |
          if ($env:CANDIDATE_ZIP) {
            ./v2/tools/recette-binaires-publies.ps1 -Work "$env:RUNNER_TEMP\recette-binaires" -CandidateZip $env:CANDIDATE_ZIP -CandidateVersion $env:CANDIDATE_VERSION -CandidateSha256 $env:CANDIDATE_SHA256
          } else {
            ./v2/tools/recette-binaires-publies.ps1 -Work "$env:RUNNER_TEMP\recette-binaires"
          }

      - name: Résumé
        if: always()
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'recette-binaires\logs\recette-binaires.json'
          if (Test-Path -LiteralPath $report) { Get-Content -LiteralPath $report -Raw -Encoding UTF8 } else { 'Aucun rapport.' }

      - name: Conserver les journaux
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: domenia-v2-recette-binaires-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recette-binaires/logs/
          if-no-files-found: warn
          retention-days: 14
